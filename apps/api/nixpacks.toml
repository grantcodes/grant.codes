[phases.setup]
nixPkgs=['...', 'gccStdenv', 'cairo', 'pkg-config']
aptPkgs=['build-essential', 'libcairo2-dev', 'libpango1.0-dev', 'libjpeg-dev', 'libgif-dev', 'librsvg2-dev', 'libpixman-1-dev']

# pnpm workspace root is the monorepo root; navigate up for install/build
[phases.install]
cmds=['cd ../.. && pnpm install --frozen-lockfile']

[phases.build]
cmds=['cd ../.. && pnpm --filter api build']

[start]
cmd='cd ../.. && pnpm --filter api start'
