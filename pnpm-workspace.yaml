packages:
  - 'apps/*'
allowBuilds:
  '@parcel/watcher': true
  canvas: true
  core-js: true
  esbuild: true
  leveldown: true
  rxdb: true
  sharp: true
  unrs-resolver: true
blockExoticSubdeps: false
minimumReleaseAgeExclude:
  - astro@6.4.5
  - '@grantcodes/astro@0.2.7'
  - '@grantcodes/ui@2.16.0'
patchedDependencies:
  '@grantcodes/astro@0.2.7': patches/@grantcodes__astro@0.2.7.patch
