name: Monthly Data Update

on:
  workflow_dispatch:
    inputs:
      months:
        description: >-
          Months to generate, e.g. "2024-05..2024-12 2025-03"
          (default: previous month)
        required: false
        default: ''
  schedule:
    - cron: 0 12 1 * *

permissions:
  contents: write

concurrency:
  group: monthly-data

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Generate monthly data
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          MICROPUB_TOKEN: ${{ secrets.MICROPUB_TOKEN }}
          DAWARICH_URL: ${{ secrets.DAWARICH_URL }}
          DAWARICH_API_KEY: ${{ secrets.DAWARICH_API_KEY }}
          HOME_ASSISTANT_KEY: ${{ secrets.HOME_ASSISTANT_KEY }}
          HOME_ASSISTANT_URL: ${{ secrets.HOME_ASSISTANT_URL }}
          MONTHS: ${{ inputs.months }}
        working-directory: apps/site
        # MONTHS is unquoted so each month or range is its own argument.
        run: node bin/generate-monthly-data.js --save $MONTHS

      # Commit the months that succeeded; the job still reports any failure.
      - name: Commit and push
        if: ${{ !cancelled() }}
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add apps/site/data/monthly
          if git diff --cached --quiet; then
            echo "No monthly data changes"
            exit 0
          fi
          git commit -m "chore(site): update monthly data"
          git pull --rebase
          git push
